<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f2a" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>60 ثانية</title>
  <style>
    :root{
      --bg:#07171f; --card:#0d2632; --text:#f7fbfc; --muted:#b8c9cf;
      --accent:#79d7d0; --accent2:#9cb1ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 10%,#123747 0,#07171f 38%,#041017 100%);color:var(--text);font-family:Tahoma,Arial,sans-serif}
    body{min-height:100svh;display:flex;justify-content:center}
    button{font:inherit}
    .app{width:min(100%,520px);min-height:100svh;display:flex;flex-direction:column;padding:18px 16px 22px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{font-size:13px;color:var(--muted);white-space:nowrap}
    .progress{height:6px;flex:1;background:#ffffff12;border-radius:99px;overflow:hidden}
    .bar{height:100%;width:4%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .45s ease}
    .card{margin:auto 0;background:linear-gradient(180deg,#102b38dd,#0a202bdd);border:1px solid #ffffff12;border-radius:26px;padding:24px 18px;box-shadow:0 24px 70px #0007;backdrop-filter:blur(12px);animation:in .32s ease}
    @keyframes in{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    .emoji{font-size:46px;line-height:1;margin-bottom:16px}
    h1,h2{margin:0 0 10px;line-height:1.45}
    h1{font-size:29px}
    h2{font-size:24px}
    p{font-size:17px;line-height:1.85;color:var(--muted);margin:8px 0}
    .tiny{font-size:13px;opacity:.78}
    .answers{display:grid;gap:10px;margin-top:22px}
    .choice,.primary{width:100%;border:0;border-radius:17px;padding:15px 16px;cursor:pointer;transition:.18s ease}
    .choice{background:#ffffff0d;color:var(--text);border:1px solid #ffffff13;text-align:right}
    .choice:active{transform:scale(.985);background:#ffffff18}
    .primary{background:linear-gradient(100deg,var(--accent),#8bdcc0);color:#06202a;font-weight:700;text-align:center;margin-top:18px}
    .note{margin-top:16px;padding:13px 14px;border-radius:14px;background:#ffffff0a;color:#dce9ec;font-size:15px;line-height:1.75}
    .photo-wrap{border-radius:22px;overflow:hidden;margin:-6px -2px 16px;position:relative;background:#0b1b22;aspect-ratio:4/5}
    .photo{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 4.5s ease both}
    @keyframes zoom{from{transform:scale(1.03)}to{transform:scale(1.08)}}
    .photo-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 54%,#06131ccd 100%)}
    .photo-step{position:absolute;bottom:14px;right:14px;background:#07171fbd;border:1px solid #ffffff22;padding:7px 10px;border-radius:99px;font-size:12px}
    .loader{display:flex;gap:8px;justify-content:center;margin:28px 0 8px}
    .loader i{width:10px;height:10px;background:var(--accent);border-radius:50%;animation:b 1s infinite alternate}
    .loader i:nth-child(2){animation-delay:.2s}.loader i:nth-child(3){animation-delay:.4s}
    @keyframes b{to{opacity:.2;transform:translateY(-8px)}}
    .result{background:linear-gradient(160deg,#fff8e3,#e8fffb);color:#09232d}
    .result p{color:#36515a}
    .score{font-size:58px;font-weight:800;line-height:1;margin:6px 0 14px}
    .label{font-size:14px;opacity:.72;margin-bottom:2px}
    .result-title{font-size:29px;font-weight:800;line-height:1.45;margin:8px 0}
    .result .note{background:#09232d0d;color:#24434c}
    .footer{text-align:center;color:#78919a;font-size:11px;margin-top:18px}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">اختبار الـ 60 ثانية</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
  <main id="screen"></main>
  <div class="footer">جاوبي بسرعة… أول إحساس غالبًا هو الصح 😉</div>
</div>

<script>
const S=document.getElementById('screen'), B=document.getElementById('bar');
let step=0, answers=[];
const imgOverview='https://bynder.onthebeach.co.uk/cdn-cgi/image/width%3D1400%2Cquality%3D80%2Cfit%3Dcover%2Cformat%3Dauto/asset/6b32c441-f88c-43a6-b917-50747e453d60/default/-Seven-Seas-Jolie-Bay-20-04.jpg';
const imgAqua='https://fileservice.sevenseashotels.com/files/bg/resources/img/9ebb4ebd-6c76-4543-92d1-dfe99c513f14.JPG';
const imgPool='https://fileservice.sevenseashotels.com/files/md/resources/img/0515d3b8-1973-403e-9156-ff4dda57ce3b.JPG';

function progress(n){B.style.width=Math.max(4,Math.min(100,n))+'%'}
function card(inner,cls=''){S.innerHTML='<section class="card '+cls+'">'+inner+'</section>'}
function choices(arr){return '<div class="answers">'+arr.map((x,i)=>'<button class="choice" onclick="window.pick('+i+')">'+x+'</button>').join('')+'</div>'}
function ask(emoji,title,body,arr,next){
  step++; progress(step*9);
  card('<div class="emoji">'+emoji+'</div><h2>'+title+'</h2><p>'+body+'</p>'+choices(arr));
  window.pick=i=>{answers.push(i); next(i)};
}
function start(){
  step=0;answers=[];progress(4);
  card('<div class="emoji">🧠</div><h1>إنتِ محتاجة تفصلي قد إيه؟</h1><p>اختبار خفيف من بتوع «اختاري بسرعة ومتراجعيش إجابتك» 😄</p><div class="note">6 أسئلة بس… وفي الآخر هيقولك أنسب نوع تغيير جو ليكي دلوقتي.</div><button class="primary" onclick="q1()">ابدئي</button>');
}
function q1(){
  ask('😮‍💨','أول ما اليوم يخلص…','إيه أول حاجة نفسك تعمليها غالبًا؟',[
    'أنام من غير ما حد يصحيني',
    'أقعد في هدوء ومحدش يكلمني شوية',
    'أخرج من البيت حتى لو مشوار صغير',
    'أعمل حاجة حلوة تغيّر المود'
  ],()=>q2());
}
function q2(){
  ask('📵','لو جالك يوم فاضي فجأة…','من غير شغل ولا طلبات ولا التزامات، تختاري إيه؟',[
    'أقفل الموبايل وأنام',
    'أخرج آكل حاجة حلوة',
    'أروح مكان مفتوح وهادي',
    'أتحرك وأسافر حتى لو قريب'
  ],()=>q3());
}
function q3(){
  ask('🌅','اختاري المنظر اللي يريح عينك أكتر','من غير تفكير كتير:',[
    'بحر وصوت مية',
    'خضرة وهوا نضيف',
    'مدينة وأنوار بالليل',
    'أوضة مريحة وسرير محترم 😅'
  ],()=>q4());
}
function q4(){
  ask('🧳','في أي خروجة أو سفرية…','إيه أكتر حاجة بتفرق معاكي فعلًا؟',[
    'إني ما أشيلش هم أي حاجة',
    'المكان نفسه يبقى مريح ويفصل',
    'يبقى فيه حاجات نعملها وممانملش',
    'الأكل والخدمة يبقوا كويسين'
  ],()=>q5());
}
function q5(){
  ask('🎈','لو المكان فيه كل حاجة…','إيه اللي يخلي اليوم كامل بالنسبالك؟',[
    'قعدة هادية على المية',
    'Pool أو ألعاب مائية',
    'أكل حلو وقعدة لطيفة',
    'كل واحد يلاقي حاجة تبسطه'
  ],()=>q6());
}
function q6(){
  ask('⚡','آخر سؤال: بطاريتك دلوقتي عاملة كام؟','اختاري الأقرب بصدق 😄',[
    '10% — شاحن فوري لو سمحت',
    '30% — ماشية بالعافية',
    '60% — كويسة بس محتاجة تغيير',
    '80% — أنا تمام… بس مش هرفض فسحة 😅'
  ],()=>analyze());
}
function analyze(){
  progress(67);
  card('<div class="emoji">🔎</div><h2>بنحسب النتيجة…</h2><p>مستوى الزهق، احتياجك للهدوء، ونوع المكان اللي بيريّحك.</p><div class="loader"><i></i><i></i><i></i></div><p class="tiny" style="text-align:center">ثواني والنتيجة تظهر…</p>');
  setTimeout(()=>photo1(),1800);
}
function photoCard(src,num,title,body,opts,next){
  progress(69+num*7);
  card('<div class="photo-wrap"><img class="photo" referrerpolicy="no-referrer" src="'+src+'" alt=""><div class="photo-shade"></div><div class="photo-step">اختيار '+num+' من 3</div></div><h2>'+title+'</h2><p>'+body+'</p>'+choices(opts));
  window.pick=i=>{answers.push(i);next(i)};
}
function photo1(){
  photoCard(imgPool,1,'لو ده كان قدامك دلوقتي…','أول إحساس؟',[
    'آه… ده يروق فعلًا 😍',
    'حلو أوي',
    'مش هعترض خالص 😅'
  ],()=>photo2());
}
function photo2(){
  photoCard(imgAqua,2,'طب والجزء ده؟','أقرب تعليق ليكي:',[
    'ده يغيّر مود أي حد 😂',
    'حلو إن فيه حاجات تتعمل',
    'تمام… كمّل'
  ],()=>photo3());
}
function photo3(){
  photoCard(imgOverview,3,'وآخر واحدة…','لو مكان بالشكل ده اتعرض عليكي كام يوم:',[
    'أوافق فورًا 😄',
    'أهو ده تغيير الجو الصح',
    'فين أوقّع؟ 😂'
  ],()=>showResult());
}
function showResult(){
  progress(100);
  const battery = answers[5] ?? 1;
  const score = [94,89,82,76][battery] || 88;
  const mood = battery<=1 ? 'محتاجة تفصلي بجد' : 'محتاجة تغيير جو محترم';
  card('<div class="label">نتيجتك</div><div class="score">'+score+'%</div><div class="result-title">'+mood+' 😅</div><p>إجاباتك بتقول إنك مش محتاجة «خروجة ساعتين وخلاص» قد ما محتاجة كام يوم تبعدي فيهم عن الروتين، من غير تجهيز كتير ولا مسؤوليات، وفي مكان يشرح النفس.</p><div class="note"><b>النوع الأنسب ليكي دلوقتي:</b><br>بحر + راحة + أكل جاهز + حاجات تتعمل + وقت حلو من غير دوشة الحياة.</div><p style="margin-top:18px"><b>وباختصار؟ إنتِ فعلًا تستحقي فسحة حلوة في مكان زي ده ❤️</b></p><button class="primary" onclick="location.reload()">أعيد الاختبار</button>','result');
}
start();
</script>
</body>
</html>
